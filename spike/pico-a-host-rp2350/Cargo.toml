[package]
name = "pico-a-host-rp2350-spike"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
embassy-executor   = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time       = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp         = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb-host   = { version = "0.1.0",  features = ["defmt"] }
embassy-usb-driver = "0.2.1"
embassy-sync       = "0.8.0"

defmt        = "1.0.1"
defmt-rtt    = "1.0.0"
panic-probe  = { version = "1.0.0", features = ["print-defmt"] }

cortex-m     = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt  = "0.7.0"

[patch.crates-io]
embassy-executor   = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time       = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-rp         = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-usb-host   = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-sync       = { git = "https://github.com/embassy-rs/embassy", branch = "main" }

[profile.release]
debug = true
lto = true
opt-level = "z"
