[package]
name = "pico-a-host-handrolled-spike"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
cortex-m    = "0.7"
cortex-m-rt = "0.7"
rp235x-hal  = { version = "0.3", features = ["rt", "critical-section-impl", "binary-info", "defmt"] }

defmt       = "0.3"
defmt-rtt   = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

embedded-hal = "1.0"

[profile.release]
debug = true
lto = true
opt-level = "z"
